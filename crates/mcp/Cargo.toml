[package]
name = "mini-app-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent-First CRUD store MCP server — 1 daemon per table, schema.yaml driven, SQLite backend"
repository.workspace = true
readme = "../../README.md"
keywords = ["mcp", "sqlite", "agent", "crud", "schema"]
categories = ["database", "command-line-utilities"]

[lib]
name = "mini_app_mcp"
path = "src/lib.rs"

[[bin]]
name = "mini-app-mcp"
path = "src/main.rs"

[dependencies]
mini-app-core = { workspace = true }
rmcp = { version = "1.8", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2.5.5"
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
futures = "0.3"
trybuild = "1"
tokio-util = "0"
