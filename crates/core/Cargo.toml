[package]
name = "mini-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent-First CRUD store core library — schema.yaml driven, SQLite backend (transport-agnostic)"
repository.workspace = true
readme = "../../README.md"
keywords = ["sqlite", "agent", "crud", "schema", "yaml"]
categories = ["database", "data-structures"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2.5.5"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
schemars = "1.2"
thiserror = "2"
anyhow = "1"
dirs = "5"
dotenvy = "0.15"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
arc-swap = "1"
sha2 = "0.10"
hex = "0.4"
minijinja = "2"

[dev-dependencies]
tempfile = "3"
futures = "0.3"
