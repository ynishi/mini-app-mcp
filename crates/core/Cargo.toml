[package]
name = "mini-app-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Yutaka Nishimura"]
license = "MIT OR Apache-2.0"
description = "Agent-First CRUD store core library — schema.yaml driven, SQLite backend (transport-agnostic)"
repository = "https://github.com/ynishi/mini-app-mcp"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2.5.5"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
schemars = "1.2"
thiserror = "2"
anyhow = "1"
dirs = "5"
dotenvy = "0.15"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
arc-swap = "1"
sha2 = "0.10"
hex = "0.4"
minijinja = "2"

[dev-dependencies]
tempfile = "3"
futures = "0.3"
