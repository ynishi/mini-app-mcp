[package]
name = "mini-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent-First CRUD store core library — schema.yaml driven, SQLite backend (transport-agnostic)"
repository.workspace = true
readme = "../../README.md"
keywords = ["sqlite", "agent", "crud", "schema", "yaml"]
categories = ["database", "data-structures"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_bw = "2.5.5"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
schemars = "1.2"
thiserror = "2"
anyhow = "1"
dirs = "5"
dotenvy = "0.15"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
arc-swap = "1"
sha2 = "0.10"
hex = "0.4"
minijinja = "2"
object_store = { version = "0.12", features = ["aws"], optional = true }
bytes = { version = "1", optional = true }

[features]
# S3-compatible snapshot upload (AWS S3 / Backblaze B2 / R2 / MinIO via
# custom endpoint). Off by default so the base build carries zero extra deps.
s3-upload = ["dep:object_store", "dep:bytes"]

[dev-dependencies]
tempfile = "3"
futures = "0.3"
