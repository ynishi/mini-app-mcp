# fly.toml — host mini-app-mcp on Fly.io Machines (single machine + volume,
# single-writer model preserved: every device talks to this one daemon).
#
# Usage (from the repo root — the Dockerfile is auto-detected there):
#   fly deploy --config contrib/fly/fly.toml
#
# Full walkthrough: docs/runbooks/fly-io-deploy.md
#
# `app` is a placeholder — create your own app first:
#   fly apps create <your-app-name>
app = "CHANGE-ME"
primary_region = "nrt"

[processes]
  # Non-loopback bind requires MINI_APP_HTTP_TOKEN (set as a Fly secret);
  # TLS terminates at the Fly edge, so the container speaks plain HTTP.
  app = "--mcp-http --bind 0.0.0.0:8484"

[env]
  # SQLite + schema.yaml live on the mounted volume.
  MINI_APP_USER_DIR = "/data/mini-app"
  # Daily backup via supercronic (contrib/docker/entrypoint.sh).
  # Cron runs in UTC: 03:00 UTC = 12:00 JST. Unset to disable.
  BACKUP_CRON = "0 3 * * *"

[[mounts]]
  # fly volumes create mini_app_data --region nrt --size 1
  source = "mini_app_data"
  destination = "/data"

[http_service]
  internal_port = 8484
  force_https = true
  # A stateful daemon should not scale to zero or fan out: exactly one
  # machine may own the volume / SQLite file.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
